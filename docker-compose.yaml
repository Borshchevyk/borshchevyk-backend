version: '3.8'

services:
  borshchevyk-postgres:
    container_name: ${ENV_PREFIX}-postgres
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_DB_NAMES}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${ENV_PREFIX}-postgres-data:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    container_name: ${ENV_PREFIX}-zookeeper
    image: ${ZOOKEEPER_IMAGE:-confluentinc/cp-zookeeper:7.3.2}
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}

  kafka:
    container_name: ${ENV_PREFIX}-kafka
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.3.2}
    hostname: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_CLIENT_PORT}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}

  borshchevyk-redis:
    container_name: ${ENV_PREFIX}-redis
    image: ${REDIS_IMAGE:-redis:7-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    container_name: ${ENV_PREFIX}-auth-service
    image: ${AUTH_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.auth
    restart: on-failure
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_AUTH}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_REDIS_HOST=borshchevyk-redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      borshchevyk-redis:
        condition: service_healthy

  user-service:
    container_name: ${ENV_PREFIX}-user-service
    image: ${USER_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.user
    restart: on-failure
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_USER}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  message-service:
    container_name: ${ENV_PREFIX}-message-service
    image: ${MESSAGE_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.message
    restart: on-failure
    ports:
      - "${MESSAGE_SERVICE_PORT}:${MESSAGE_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_MESSAGE}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_REDIS_HOST=borshchevyk-redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      borshchevyk-redis:
        condition: service_healthy

  sync-service:
    container_name: ${ENV_PREFIX}-sync-service
    image: ${SYNC_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.sync
    restart: on-failure
    ports:
      - "${SYNC_SERVICE_PORT}:${SYNC_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_SYNC}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  gateway-service:
    container_name: ${ENV_PREFIX}-gateway-service
    image: ${GATEWAY_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.gateway
    restart: on-failure
    ports:
      - "${GATEWAY_INTERNAL_PORT}:${GATEWAY_INTERNAL_PORT}"
    env_file:
      - .env
    environment:
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - MESSAGE_SERVICE_URL=${MESSAGE_SERVICE_URL}
      - SYNC_SERVICE_URL=${SYNC_SERVICE_URL}
    depends_on:
      - auth-service
      - user-service
      - message-service
      - sync-service

  admin-service:
    container_name: ${ENV_PREFIX}-admin-service
    image: ${ADMIN_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.admin
    restart: on-failure
    ports:
      - "${ADMIN_SERVICE_PORT}:${ADMIN_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

  caddy:
    container_name: ${ENV_PREFIX}-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT}:80"
      - "${CADDY_HTTPS_PORT}:443"
      - "${CADDY_HTTPS_PORT}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ${ENV_PREFIX}-caddy_data:/data
      - ${ENV_PREFIX}-caddy_config:/config
    env_file:
      - .env
    depends_on:
      - gateway-service

volumes:
  dev-postgres-data:
  prod-postgres-data:
  dev-caddy_data:
  dev-caddy_config:
  prod-caddy_data:
  prod-caddy_config:
