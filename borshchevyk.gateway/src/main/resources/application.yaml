spring:
  application:
    name: borshchevyk.gateway

  main:
    web-application-type: reactive

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  autoconfigure:
    exclude: org.springframework.cloud.autoconfigure.LifecycleMvcEndpointAutoConfiguration

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders: "*"
            allowedMethods: "*"
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/api/v1/users/**, /api/v1/contacts/**
          filters:
            - JwtAuthenticationFilter

        - id: message-service-ws
          uri: ${MESSAGE_SERVICE_URL}
          predicates:
            - Path=/api/v1/messages/ws-message, /api/v1/messages/ws-message/**
          filters:
            - StripPrefix=3

        - id: message-service
          uri: ${MESSAGE_SERVICE_URL}
          predicates:
            - Path=/api/v1/messages/**, /api/v1/chats/**, /api/v1/search/**
          filters:
            - JwtAuthenticationFilter

        - id: sync-service
          uri: ${SYNC_SERVICE_URL}
          predicates:
            - Path=/api/v1/sync/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: media-service
          uri: ${MEDIA_SERVICE_URL}
          predicates:
            - Path=/api/v1/media/**
          filters:
            - JwtAuthenticationFilter

        - id: auth-service-swagger
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - RewritePath=/v3/api-docs/auth, /v3/api-docs

        - id: user-service-swagger
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - RewritePath=/v3/api-docs/user, /v3/api-docs

        - id: message-service-swagger
          uri: ${MESSAGE_SERVICE_URL}
          predicates:
            - Path=/v3/api-docs/message
          filters:
            - RewritePath=/v3/api-docs/message, /v3/api-docs

        - id: sync-service-swagger
          uri: ${SYNC_SERVICE_URL}
          predicates:
            - Path=/v3/api-docs/sync
          filters:
            - RewritePath=/v3/api-docs/sync, /v3/api-docs

        - id: media-service-swagger
          uri: ${MEDIA_SERVICE_URL}
          predicates:
            - Path=/v3/api-docs/media
          filters:
            - RewritePath=/v3/api-docs/media, /v3/api-docs

        - id: calls-service
          uri: ${CALLS_SERVICE_URL}
          predicates:
            - Path=/api/v1/calls/**
          filters:
            - JwtAuthenticationFilter

        - id: calls-service-swagger
          uri: ${CALLS_SERVICE_URL}
          predicates:
            - Path=/v3/api-docs/calls
          filters:
            - RewritePath=/v3/api-docs/calls, /v3/api-docs

        - id: livekit-server
          uri: ${LIVEKIT_SERVER_URL:http://livekit-server:7880}
          predicates:
            - Path=/livekit/**
          filters:
            - StripPrefix=1
  boot:
    admin:
      client:
        url: "http://admin-service:${ADMIN_SERVICE_PORT:8085}/admin"
        username: ${ADMIN_USERNAME:admin}
        password: ${ADMIN_PASSWORD:admin}
        instance:
          prefer-ip: true

server:
  port: 8080
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /v3/api-docs/auth
      - name: user-service
        url: /v3/api-docs/user
      - name: message-service
        url: /v3/api-docs/message
      - name: sync-service
        url: /v3/api-docs/sync
      - name: media-service
        url: /v3/api-docs/media
      - name: calls-service
        url: /v3/api-docs/calls

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  file:
    name: logs/${spring.application.name}.log
