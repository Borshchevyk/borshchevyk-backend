server:
  port: ${MESSAGE_SERVICE_PORT}
  forward-headers-strategy: framework

spring:
  application:
    name: borshchevyk.message
  datasource:
    url: ${SPRING_DATASOURCE_URL_MESSAGE}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
        generate_statistics: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: message-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
  boot:
    admin:
      client:
        url: "${ADMIN_SERVICE_URL}"
        username: ${ADMIN_USERNAME}
        password: ${ADMIN_PASSWORD}
        instance:
          prefer-ip: true

grpc:
  server:
    port: ${MESSAGE_GRPC_PORT}
  client:
    user-service:
      address: '${GRPC_USER_SERVICE_ADDRESS}'
      negotiation-type: plaintext

app:
  kafka:
    topics:
      user-deleted: ${KAFKA_TOPIC_USER_DELETED}
      user-registered: ${KAFKA_TOPIC_USER_REGISTERED}
      call-events: ${KAFKA_TOPIC_CALL_EVENTS}
  media-service:
    url: ${MEDIA_SERVICE_URL}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,env,metrics,loggers,httpexchanges,logfile"
  endpoint:
    health:
      show-details: always

logging:
  file:
    name: logs/${spring.application.name}.log