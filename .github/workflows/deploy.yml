name: Build and Deploy

on:
  push:
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ghcr.io/borshchevyk/borshchevyk-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./borshchevyk.auth
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/auth-service:latest

      - name: Build and push User Service
        uses: docker/build-push-action@v5
        with:
          context: ./borshchevyk.user
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/user-service:latest

      - name: Build and push Message Service
        uses: docker/build-push-action@v5
        with:
          context: ./borshchevyk.message
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/message-service:latest

      - name: Build and push Gateway Service
        uses: docker/build-push-action@v5
        with:
          context: ./borshchevyk.gateway
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/gateway-service:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd ~/borshchevyk-backend
            git pull origin dev
            echo "${{ secrets.PROD_ENV_FILE }}" > .env
            
            # Логинимся в GitHub Container Registry на сервере
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Скачиваем новые образы с GHCR
            docker-compose pull
            
            # Перезапускаем контейнеры с новыми образами
            docker-compose up -d
            
            # Очищаем систему от старых образов
            docker image prune -af
