name: Build and Deploy

on:
  push:
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ghcr.io/borshchevyk/dev-borshchevyk-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Auth Service
        run: mvn -f borshchevyk.auth/pom.xml clean package -DskipTests

      - name: Build User Service
        run: mvn -f borshchevyk.user/pom.xml clean package -DskipTests

      - name: Build Message Service
        run: mvn -f borshchevyk.message/pom.xml clean package -DskipTests

      - name: Build Sync Service
        run: mvn -f borshchevyk.sync/pom.xml clean package -DskipTests

      - name: Build Media Service
        run: mvn -f borshchevyk.media/pom.xml clean package -DskipTests

      - name: Build Gateway Service
        run: mvn -f borshchevyk.gateway/pom.xml clean package -DskipTests

      - name: Build Admin Service
        run: mvn -f borshchevyk.admin/pom.xml clean package -DskipTests

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./borshchevyk.auth
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/auth-service:latest

      - name: Build and push User Service
        uses: docker/build-push-action@v5
        with:
          context: ./borshchevyk.user
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/user-service:latest

      - name: Build and push Message Service
        uses: docker/build-push-action@v5
        with:
          context: ./borshchevyk.message
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/message-service:latest

      - name: Build and push Sync Service
        uses: docker/build-push-action@v5
        with:
          context: ./borshchevyk.sync
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/sync-service:latest
          
      - name: Build and push Media Service
        uses: docker/build-push-action@v5
        with:
          context: ./borshchevyk.media
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/media-service:latest

      - name: Build and push Gateway Service
        uses: docker/build-push-action@v5
        with:
          context: ./borshchevyk.gateway
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/gateway-service:latest

      - name: Build and push Admin Service
        uses: docker/build-push-action@v5
        with:
          context: ./borshchevyk.admin
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/admin-service:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEV_VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.DEV_VPS_SSH_PRIVATE_KEY }}
          envs: DEV_ENV_FILE,GH_TOKEN,GH_ACTOR
          script: |
            cd ~/borshchevyk-backend
            git checkout dev
            git pull
            echo "$DEV_ENV_FILE" > .env
            echo "$GH_TOKEN" | sudo docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -af
