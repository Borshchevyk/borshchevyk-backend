server:
  port: ${MEDIA_SERVICE_PORT:8086}
  forward-headers-strategy: framework

spring:
  application:
    name: media-service
  boot:
    admin:
      client:
        url: "http://admin-service:${ADMIN_SERVICE_PORT:8085}/admin"
        username: ${ADMIN_USERNAME:admin}
        password: ${ADMIN_PASSWORD:admin}
        instance:
          prefer-ip: true
  datasource:
    url: ${SPRING_DATASOURCE_URL_MEDIA:jdbc:postgresql://localhost:5432/borshchevyk_media}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs

app:
  s3:
    endpoint: ${S3_ENDPOINT:https://borshchevik.s3.cloud.ru}
    region: ${S3_REGION:ru-central-1}
    bucket: ${S3_BUCKET:borshchevyk-media}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,env,metrics,loggers,httpexchanges,logfile"
  endpoint:
    health:
      show-details: always
