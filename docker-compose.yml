services:
  borshchevyk-postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_DB_NAMES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: ${KAFKA_IMAGE}
    hostname: kafka
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  borshchevyk-redis:
    image: ${REDIS_IMAGE}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    image: ${AUTH_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.auth
    restart: on-failure
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_AUTH}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      borshchevyk-redis:
        condition: service_healthy

  user-service:
    image: ${USER_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.user
    restart: on-failure
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_USER}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  message-service:
    image: ${MESSAGE_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.message
    restart: on-failure
    ports:
      - "${MESSAGE_SERVICE_PORT}:${MESSAGE_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_MESSAGE}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      borshchevyk-redis:
        condition: service_healthy

  sync-service:
    image: ${SYNC_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.sync
    restart: on-failure
    ports:
      - "${SYNC_SERVICE_PORT}:${SYNC_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_SYNC}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  media-service:
    image: ${MEDIA_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.media
    restart: on-failure
    ports:
      - "${MEDIA_SERVICE_PORT}:${MEDIA_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_MEDIA}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy

  calls-service:
    image: ${CALLS_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.calls
    restart: on-failure
    ports:
      - "${CALLS_SERVICE_PORT}:${CALLS_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_CALLS}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  gateway-service:
    image: ${GATEWAY_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.gateway
    restart: on-failure
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - MESSAGE_SERVICE_URL=${MESSAGE_SERVICE_URL}
      - SYNC_SERVICE_URL=${SYNC_SERVICE_URL}
      - MEDIA_SERVICE_URL=${MEDIA_SERVICE_URL}
      - CALLS_SERVICE_URL=${CALLS_SERVICE_URL}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
    depends_on:
      - auth-service
      - user-service
      - message-service
      - sync-service
      - media-service
      - calls-service

  admin-service:
    image: ${ADMIN_SERVICE_IMAGE}
    build:
      context: ./borshchevyk.admin
    restart: on-failure
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

  livekit-server:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      - LIVEKIT_REDIS_ADDRESS=${SPRING_REDIS_HOST}:${SPRING_REDIS_PORT}
      - "LIVEKIT_WEBHOOK_URLS=http://gateway-service:8080/api/v1/calls/webhook"
    depends_on:
      borshchevyk-redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT}:80"
      - "${CADDY_HTTPS_PORT}:443"
      - "${CADDY_HTTPS_PORT}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    depends_on:
      - gateway-service

volumes:
  postgres-data:
  caddy_data:
  caddy_config:
