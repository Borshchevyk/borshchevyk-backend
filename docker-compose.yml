services:
  borshchevyk-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_DB_NAMES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: ${ZOOKEEPER_IMAGE:-confluentinc/cp-zookeeper:7.3.2}
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
      KAFKA_HEAP_OPTS: "-Xms128M -Xmx128M"

  kafka:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.3.2}
    hostname: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_CLIENT_PORT}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M"

  borshchevyk-redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-ghcr.io/borshchevyk/borshchevyk-backend/auth-service:latest}
    build:
      context: ./borshchevyk.auth
    restart: on-failure
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:${AUTH_SERVICE_PORT:-8081}"
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_AUTH:-jdbc:postgresql://borshchevyk-postgres:5432/borshchevyk_auth}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST:-borshchevyk-redis}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT:-6379}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      borshchevyk-redis:
        condition: service_healthy

  user-service:
    image: ${USER_SERVICE_IMAGE:-ghcr.io/borshchevyk/borshchevyk-backend/user-service:latest}
    build:
      context: ./borshchevyk.user
    restart: on-failure
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_USER:-jdbc:postgresql://borshchevyk-postgres:5432/borshchevyk_user}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  message-service:
    image: ${MESSAGE_SERVICE_IMAGE:-ghcr.io/borshchevyk/borshchevyk-backend/message-service:latest}
    build:
      context: ./borshchevyk.message
    restart: on-failure
    ports:
      - "${MESSAGE_SERVICE_PORT:-8083}:${MESSAGE_SERVICE_PORT:-8083}"
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_MESSAGE:-jdbc:postgresql://borshchevyk-postgres:5432/borshchevyk_message}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST:-borshchevyk-redis}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT:-6379}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      borshchevyk-redis:
        condition: service_healthy

  sync-service:
    image: ${SYNC_SERVICE_IMAGE:-ghcr.io/borshchevyk/borshchevyk-backend/sync-service:latest}
    build:
      context: ./borshchevyk.sync
    restart: on-failure
    ports:
      - "${SYNC_SERVICE_PORT:-8084}:${SYNC_SERVICE_PORT:-8084}"
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_SYNC:-jdbc:postgresql://borshchevyk-postgres:5432/borshchevyk_sync}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  media-service:
    image: ${MEDIA_SERVICE_IMAGE:-ghcr.io/borshchevyk/borshchevyk-backend/media-service:latest}
    build:
      context: ./borshchevyk.media
    restart: on-failure
    ports:
      - "${MEDIA_SERVICE_PORT:-8086}:${MEDIA_SERVICE_PORT:-8086}"
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_MEDIA:-jdbc:postgresql://borshchevyk-postgres:5432/borshchevyk_media}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy

  calls-service:
    image: ${CALLS_SERVICE_IMAGE:-ghcr.io/borshchevyk/borshchevyk-backend/calls-service:latest}
    build:
      context: ./borshchevyk.calls
    restart: on-failure
    ports:
      - "${CALLS_SERVICE_PORT:-8087}:${CALLS_SERVICE_PORT:-8087}"
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_CALLS:-jdbc:postgresql://borshchevyk-postgres:5432/borshchevyk_calls}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - LIVEKIT_URL=${LIVEKIT_URL:-http://livekit-server:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
    depends_on:
      borshchevyk-postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  gateway-service:
    image: ${GATEWAY_SERVICE_IMAGE:-ghcr.io/borshchevyk/borshchevyk-backend/gateway-service:latest}
    build:
      context: ./borshchevyk.gateway
    restart: on-failure
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:8081}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:8082}
      - MESSAGE_SERVICE_URL=${MESSAGE_SERVICE_URL:-http://message-service:8083}
      - SYNC_SERVICE_URL=${SYNC_SERVICE_URL:-http://sync-service:8084}
      - MEDIA_SERVICE_URL=${MEDIA_SERVICE_URL:-http://media-service:8086}
      - CALLS_SERVICE_URL=${CALLS_SERVICE_URL:-http://calls-service:8087}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST:-borshchevyk-redis}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT:-6379}
    depends_on:
      - auth-service
      - user-service
      - message-service
      - sync-service
      - media-service
      - calls-service

  admin-service:
    image: ${ADMIN_SERVICE_IMAGE:-ghcr.io/borshchevyk/borshchevyk-backend/admin-service:latest}
    build:
      context: ./borshchevyk.admin
    restart: on-failure
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}

  livekit-server:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
      - LIVEKIT_REDIS_ADDRESS=redis://borshchevyk-redis:6379
    depends_on:
      borshchevyk-redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    depends_on:
      - gateway-service

volumes:
  postgres-data:
  caddy_data:
  caddy_config:
